<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Igor Selivanov</title>
<meta name="description" content="Igor Borisovich Selivanov, Director, Dong Shin Marine and Trading Co.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700;800&display=swap">
<style>
/* Layout: same single column as the dark page, on white. Same six palette colours, used light-to-dark.
   Single light look, by design. */
:root{
  --abyss:#071C27; --deep:#123747; --tide:#245568; --steel:#477C8B; --haze:#91B3B9; --mist:#DCE9E8;
  --font:'Roboto Condensed','Arial Narrow',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:#FFFFFF}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,#FFFFFF 0%,#F3F8F8 70%) #F3F8F8;
  color:var(--abyss);font-family:var(--font);font-size:16px;line-height:1.45}
html,body{overflow-x:clip}
.wrap{position:relative;max-width:440px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 40px}
.ghost{position:absolute;left:50%;top:-30px;width:640px;max-width:none;transform:translateX(-50%);opacity:.05;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000 40%,transparent 92%);mask-image:linear-gradient(#000 40%,transparent 92%)}

.brand{position:relative;text-align:center}
.brand img{width:150px;height:auto;display:block;margin:0 auto}
.co{margin-top:10px;font-weight:800;font-size:21px;line-height:1.08;letter-spacing:.04em;text-transform:uppercase;color:var(--deep)}

.person{position:relative;margin-top:34px;text-align:center}
.last{margin:0;font-weight:800;font-size:40px;line-height:1;letter-spacing:.03em;text-transform:uppercase;color:var(--abyss)}
.first{margin-top:6px;font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;color:var(--deep)}
.rule{width:44px;height:2px;background:var(--haze);margin:18px auto 14px;border-radius:2px}
.role{font-weight:500;font-size:15px;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;color:var(--steel)}

.actions{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px}
.btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:16px;background:#FFFFFF;
  border:1px solid var(--mist);color:var(--deep);text-decoration:none;font:500 15px var(--font);letter-spacing:.04em;cursor:pointer;
  box-shadow:0 4px 14px rgba(7,28,39,.06);transition:border-color .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--haze);box-shadow:0 6px 18px rgba(7,28,39,.1)}
.btn i{width:42px;height:42px;border-radius:50%;background:var(--deep);display:grid;place-items:center}
.btn svg{width:20px;height:20px;fill:var(--mist)}
.save{grid-column:1/-1;flex-direction:row;justify-content:center;gap:12px;padding:15px;background:var(--deep);color:var(--mist);
  border-color:var(--deep);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.save:hover{background:var(--tide);border-color:var(--tide)}
.save i{width:32px;height:32px;background:var(--mist)}
.save svg{width:17px;height:17px;fill:var(--deep)}
button:focus-visible,a:focus-visible{outline:2px solid var(--steel);outline-offset:3px}

.list{position:relative;margin-top:14px;border:1px solid var(--mist);border-radius:18px;background:#FFFFFF;overflow:hidden;
  box-shadow:0 4px 14px rgba(7,28,39,.05)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.row + .row{border-top:1px solid var(--mist)}
.row > i{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mist);display:grid;place-items:center;align-self:flex-start}
.row > i svg{width:19px;height:19px;fill:var(--tide)}
.row > div{min-width:0;flex:1}
.label{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
.value{display:block;font-weight:500;font-size:18px;overflow-wrap:anywhere;color:var(--abyss);text-decoration:none}
.value.addr{font-weight:400;font-size:16px;line-height:1.4}
.copy{flex:none;border:1px solid var(--haze);background:transparent;color:var(--tide);font:500 14px var(--font);letter-spacing:.06em;
  padding:7px 12px;border-radius:10px;cursor:pointer;min-width:74px}
.copy:hover{border-color:var(--tide);color:var(--deep)}
.maplink{display:inline-block;margin-top:6px;font-size:15px;color:var(--tide)}
footer{position:relative;margin-top:26px;text-align:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--haze)}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>

  const fallback = () => {
    const r = document.createRange();
    r.selectNodeContents(b.parentElement.querySelector('.value'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); else fallback();
}));
